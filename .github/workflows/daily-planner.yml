name: Fort Custer daily advisory planner
on:
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *' # UTC; advisory schedule only
permissions:
  contents: read
concurrency:
  group: fc-daily-planner
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python src/orchestrator.py --db /tmp/fort-custer-audit.db
      - uses: actions/upload-artifact@v4
        with:
          name: advisory-plan
          path: examples/latest-report.json
          retention-days: 14
