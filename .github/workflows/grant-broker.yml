name: Synthetic grant broker and local peer transport
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-security-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  offline-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Avoid macOS /var and /tmp symlink ancestors in protected-store tests.
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install age for full encrypted-restore regression coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends age
          age --version
      - name: Install age for full encrypted-restore regression coverage (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install age
          age --version
      - name: Install pinned official Codex for offline executor probes
        run: npm install --prefix "$RUNNER_TEMP/fc-codex" @openai/codex@0.163.0
      - name: Select pinned executor for offline tests (no login or inference)
        shell: bash
        run: |
          FC_CODEX_PROBE_BINARY="$(find "$RUNNER_TEMP/fc-codex/node_modules" -type f -path '*/vendor/*/bin/codex' | head -n 1)"
          test -n "$FC_CODEX_PROBE_BINARY"
          export FC_CODEX_PROBE_BINARY
          echo "FC_CODEX_PROBE_BINARY=$FC_CODEX_PROBE_BINARY" >> "$GITHUB_ENV"
      - name: Lint
        timeout-minutes: 3
        run: make lint
      - name: Full standard regression suite (once per platform)
        timeout-minutes: 21
        run: python -u tests/ci_runner.py full --output "$RUNNER_TEMP/fc616-ci-results"
      - name: Focused optimized security boundaries
        if: ${{ !cancelled() }}
        timeout-minutes: 9
        run: python -u tests/ci_runner.py optimized-security --output "$RUNNER_TEMP/fc616-ci-results"
      - name: Preserve test timings and incomplete-test journals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-security-timings-${{ matrix.os }}
          path: ${{ runner.temp }}/fc616-ci-results
          if-no-files-found: warn
          retention-days: 14
