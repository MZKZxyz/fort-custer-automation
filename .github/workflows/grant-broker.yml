name: Synthetic grant broker and local peer transport
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Avoid macOS /var and /tmp symlink ancestors in protected-store tests.
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Broker, kernel peer authentication and failure tests
        run: python -m unittest discover -s tests -p test_grant_broker.py -v
      - name: Activation preparation, immutable bundles and exhaustion holds
        run: python -m unittest discover -s tests -p test_activation_readiness.py -v
      - name: Optimized activation safety checks
        run: python -O -m unittest discover -s tests -p test_activation_readiness.py -q
      - name: Synthetic subprocess transfer and independent QA
        run: PYTHONPATH=.:tests python tests/test_grant_broker.py --demo
      - name: Install pinned official Codex for offline executor probes
        run: npm install --prefix "$RUNNER_TEMP/fc-codex" @openai/codex@0.163.0
      - name: Actual executor boundary observations (no login or inference)
        shell: bash
        run: |
          FC_CODEX_PROBE_BINARY="$(find "$RUNNER_TEMP/fc-codex/node_modules" -type f -path '*/vendor/*/bin/codex' | head -n 1)"
          test -n "$FC_CODEX_PROBE_BINARY"
          export FC_CODEX_PROBE_BINARY
          python -m unittest discover -s tests -p test_codex_boundary.py -v
      - name: Full regression suite
        if: always()
        run: python -m unittest discover -s tests -q
