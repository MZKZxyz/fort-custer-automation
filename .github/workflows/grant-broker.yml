name: Synthetic grant broker and local peer transport
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-security:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Avoid macOS /var and /tmp symlink ancestors in protected-store tests.
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Broker, kernel peer authentication and failure tests
        run: python -m unittest discover -s tests -p test_grant_broker.py -v
      - name: Synthetic subprocess transfer and independent QA
        run: PYTHONPATH=.:tests python tests/test_grant_broker.py --demo
